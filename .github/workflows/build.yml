name: Python CI and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: python-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q document_tools main.py tests

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable Windows executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DocumentTools
          --collect-all PySide6
          --collect-all shiboken6
          main.py

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: DocumentTools-Portable-win-x64
          path: dist/DocumentTools.exe
          if-no-files-found: error
