name: Python CI, security and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: python-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Audit installed dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --local

  package-windows:
    name: Build portable Windows executable
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Windows regression tests
        run: python -m pytest -q

      - name: Build portable executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name DocumentTools
          main.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          & .\dist\DocumentTools.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\DocumentTools.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DocumentTools.exe" | Set-Content .\dist\DocumentTools.exe.sha256 -NoNewline

      - name: Upload portable executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DocumentTools-Portable-win-x64
          path: |
            dist/DocumentTools.exe
            dist/DocumentTools.exe.sha256
          if-no-files-found: error
