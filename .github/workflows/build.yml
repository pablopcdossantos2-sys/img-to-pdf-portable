name: PDF Hub CI, security and packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pdf-hub-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Audit installed dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --local

  package-windows:
    name: Build PDF Hub for Windows x64
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PDFHub main.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          & .\dist\PDFHub.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and checksum
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash .\dist\PDFHub.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  PDFHub.exe" | Set-Content .\dist\PDFHub.exe.sha256 -NoNewline
          Compress-Archive -Path .\dist\PDFHub.exe, .\dist\PDFHub.exe.sha256 -DestinationPath .\dist\PDF-Hub-Windows-x64.zip
          $zipHash = (Get-FileHash .\dist\PDF-Hub-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  PDF-Hub-Windows-x64.zip" | Set-Content .\dist\PDF-Hub-Windows-x64.zip.sha256 -NoNewline

      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Hub-Windows-x64
          path: |
            dist/PDF-Hub-Windows-x64.zip
            dist/PDF-Hub-Windows-x64.zip.sha256
          if-no-files-found: error

  package-linux:
    name: Build PDF Hub for Linux x64
    needs: test
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and XCB runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-shape0 libxcb-util1 libxcb-cursor0 libxcb-keysyms1 libxcb-icccm4 libxcb-image0 libxcb-render-util0 libxcb-xinerama0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name PDFHub main.py

      - name: Smoke-test executable
        run: QT_QPA_PLATFORM=offscreen ./dist/PDFHub --selftest

      - name: Package and checksum
        run: |
          chmod +x dist/PDFHub
          (cd dist && sha256sum PDFHub > PDFHub.sha256)
          tar -czf dist/PDF-Hub-Linux-x64.tar.gz -C dist PDFHub PDFHub.sha256
          (cd dist && sha256sum PDF-Hub-Linux-x64.tar.gz > PDF-Hub-Linux-x64.tar.gz.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Hub-Linux-x64
          path: |
            dist/PDF-Hub-Linux-x64.tar.gz
            dist/PDF-Hub-Linux-x64.tar.gz.sha256
          if-no-files-found: error

  package-macos:
    name: Build PDF Hub for macOS Apple Silicon
    needs: test
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build application bundle
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name "PDF Hub" --osx-bundle-identifier com.pdfhub.desktop main.py

      - name: Smoke-test app bundle
        run: QT_QPA_PLATFORM=offscreen "dist/PDF Hub.app/Contents/MacOS/PDF Hub" --selftest

      - name: Package and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/PDF Hub.app" "dist/PDF-Hub-macOS-arm64.zip"
          (cd dist && shasum -a 256 PDF-Hub-macOS-arm64.zip > PDF-Hub-macOS-arm64.zip.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Hub-macOS-arm64
          path: |
            dist/PDF-Hub-macOS-arm64.zip
            dist/PDF-Hub-macOS-arm64.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release and attach packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/PDF-Hub-Windows-x64/*
            release-assets/PDF-Hub-Linux-x64/*
            release-assets/PDF-Hub-macOS-arm64/*
