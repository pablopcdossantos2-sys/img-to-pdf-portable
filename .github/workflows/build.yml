name: Build and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DocumentTools.slnx

      - name: Build
        run: dotnet build DocumentTools.slnx --configuration Release --no-restore

      - name: Publish portable Windows x64
        run: dotnet publish Application/DocumentTools.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/DocumentTools-Portable-win-x64

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentTools-Portable-win-x64
          path: artifacts/DocumentTools-Portable-win-x64/
          if-no-files-found: error
