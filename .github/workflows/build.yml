name: PDF Hub CI, security and packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pdf-hub-build-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message || '', '[create-release]')) && 'release' || 'routine' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[create-release]')) }}

permissions:
  contents: read

jobs:
  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Audit installed dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --local

  package-windows:
    name: Build PDF Hub for Windows x64
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run regression tests
        run: python -m pytest -q

      - name: Generate third-party license notices
        run: python scripts/generate_third_party_notices.py --output THIRD-PARTY-NOTICES.txt

      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PDFHub main.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          python -c "import subprocess; subprocess.run([r'dist\PDFHub.exe', '--selftest'], check=True, timeout=300)"
      - name: Show smoke-test diagnostics
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'pdf-hub-selftest.log'
          if (Test-Path $log) { Get-Content $log }

      - name: Package and checksum
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash .\dist\PDFHub.exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  PDFHub.exe" | Set-Content .\dist\PDFHub.exe.sha256 -NoNewline
          Compress-Archive -Path .\dist\PDFHub.exe, .\dist\PDFHub.exe.sha256, .\LICENSE, .\LICENSES-THIRD-PARTY.md, .\THIRD-PARTY-NOTICES.txt -DestinationPath .\dist\PDF-Hub-Windows-x64.zip
          $zipHash = (Get-FileHash .\dist\PDF-Hub-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  PDF-Hub-Windows-x64.zip" | Set-Content .\dist\PDF-Hub-Windows-x64.zip.sha256 -NoNewline

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PDF-Hub-Windows-x64
          path: |
            dist/PDF-Hub-Windows-x64.zip
            dist/PDF-Hub-Windows-x64.zip.sha256
          if-no-files-found: error

  package-linux:
    name: Build PDF Hub for Linux x64
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt and XCB runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-shape0 libxcb-util1 libxcb-cursor0 libxcb-keysyms1 libxcb-icccm4 libxcb-image0 libxcb-render-util0 libxcb-xinerama0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate third-party license notices
        run: python scripts/generate_third_party_notices.py --output THIRD-PARTY-NOTICES.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name PDFHub main.py

      - name: Smoke-test executable
        run: python -c "import os, subprocess; env=os.environ.copy(); env['QT_QPA_PLATFORM']='offscreen'; subprocess.run(['./dist/PDFHub', '--selftest'], check=True, timeout=300)"
      - name: Show smoke-test diagnostics
        if: failure()
        run: cat "${TMPDIR:-/tmp}/pdf-hub-selftest.log" || true

      - name: Package and checksum
        run: |
          chmod +x dist/PDFHub
          (cd dist && sha256sum PDFHub > PDFHub.sha256)
          cp LICENSE LICENSES-THIRD-PARTY.md THIRD-PARTY-NOTICES.txt dist/
          tar -czf dist/PDF-Hub-Linux-x64.tar.gz -C dist PDFHub PDFHub.sha256 LICENSE LICENSES-THIRD-PARTY.md THIRD-PARTY-NOTICES.txt
          (cd dist && sha256sum PDF-Hub-Linux-x64.tar.gz > PDF-Hub-Linux-x64.tar.gz.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PDF-Hub-Linux-x64
          path: |
            dist/PDF-Hub-Linux-x64.tar.gz
            dist/PDF-Hub-Linux-x64.tar.gz.sha256
          if-no-files-found: error

  package-macos:
    name: Build PDF Hub for macOS Apple Silicon
    needs: test
    runs-on: macos-14
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate third-party license notices
        run: python scripts/generate_third_party_notices.py --output THIRD-PARTY-NOTICES.txt

      - name: Build application bundle
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name "PDF Hub" --osx-bundle-identifier com.pdfhub.desktop main.py

      - name: Smoke-test app bundle
        run: python -c "import os, subprocess; env=os.environ.copy(); env['QT_QPA_PLATFORM']='offscreen'; subprocess.run(['dist/PDF Hub.app/Contents/MacOS/PDF Hub', '--selftest'], check=True, timeout=300)"
      - name: Show smoke-test diagnostics
        if: failure()
        run: cat "${TMPDIR:-/tmp}/pdf-hub-selftest.log" || true

      - name: Package and checksum
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/PDF Hub.app"
          rm -rf stage && mkdir -p stage
          ditto "dist/PDF Hub.app" "stage/PDF Hub.app"
          cp LICENSE LICENSES-THIRD-PARTY.md THIRD-PARTY-NOTICES.txt stage/
          (cd stage && ditto -c -k --sequesterRsrc . "../dist/PDF-Hub-macOS-arm64.zip")
          (cd dist && shasum -a 256 PDF-Hub-macOS-arm64.zip > PDF-Hub-macOS-arm64.zip.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PDF-Hub-macOS-arm64
          path: |
            dist/PDF-Hub-macOS-arm64.zip
            dist/PDF-Hub-macOS-arm64.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    timeout-minutes: 30
    # Tags publish as usual. A deliberate marker on a main-branch commit requests
    # a one-time release only when an explicit [create-release] marker is requested.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[create-release]'))
    needs: [test, package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read application version
        id: app-version
        shell: bash
        run: echo "version=$(python -c 'from document_tools import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Validate tag and protect existing releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="v${{ steps.app-version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match application version $expected."
              exit 1
            fi
          else
            if gh release view "$expected" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $expected already exists. Bump document_tools.__version__ before requesting another release."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$expected" >/dev/null 2>&1; then
              echo "::error::Tag $expected already exists. Use a new application version."
              exit 1
            fi
          fi

      - name: Download platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets

      - name: Publish release and attach packages
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[create-release]') && format('v{0}', steps.app-version.outputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PDF Hub ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[create-release]') && format('v{0}', steps.app-version.outputs.version) || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            release-assets/PDF-Hub-Windows-x64/*
            release-assets/PDF-Hub-Linux-x64/*
            release-assets/PDF-Hub-macOS-arm64/*

