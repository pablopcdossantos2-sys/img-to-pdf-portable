[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-tools-desktop"
version = "0.2.0"
description = "Ferramentas locais para PDFs e imagens, com interface desktop."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "PySide6==6.12.0",
    "pypdf==6.21.2",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyInstaller==6.22.3",
]

[project.scripts]
document-tools = "document_tools.gui:main"

[tool.setuptools.packages.find]
include = ["document_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
