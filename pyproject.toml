[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-hub"
version = "0.4.0"
description = "Desktop tools for locally processing PDF files and images."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "PySide6==6.12.0",
    "pypdf[crypto]==6.21.2",
    "cryptography==50.0.2",
    "Pillow==13.0.0",
    "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyInstaller==6.22.3",
    "pip-audit==2.10.1",
]

[project.scripts]
pdf-hub = "document_tools.gui:main"

[tool.setuptools.packages.find]
include = ["document_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
